<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digital Me — Agent Avatars</title>
<style>
  :root{
    --canvas:#fbfcfe; --surface:#ffffff; --surface-subtle:#f7f9fc;
    --text:#111827; --text-secondary:#475467; --text-muted:#667085;
    --rule:#e4e7ec; --rule-strong:#cfd5de; --lane-rule:#eef1f5;
    --path-history:#596579; --path-terminal:#98a2b3;
    --current:#0095ff; --current-hover:#007de8; --current-soft:#eef4ff;
    --waiting:#e88700; --waiting-dark:#8a4700; --waiting-soft:#fff6e5; --waiting-border:#f2d19a;
    --danger:#c63c32;
    --success:#168a45; --success-dark:#116d37; --success-soft:#f1fbf4; --success-border:#b8dfc6;
    --action-dark:#171a1f;
    --body-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
    --mono:"SFMono-Regular","Roboto Mono",Consolas,monospace;
    --radius:12px; --radius-small:8px;
    --shadow:0 22px 64px rgba(16,24,40,.18);
    --card-shadow:0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--canvas); }
  body {
    width: 1200px; height: 800px;
    font-family: var(--body-font);
    color: var(--text);
    display: flex; flex-direction: column;
    padding: 44px 60px 44px;
    -webkit-font-smoothing: antialiased;
  }

  header { flex: 0 0 auto; }
  .head-row {
    display: flex; align-items: baseline;
    justify-content: space-between; gap: 24px;
  }
  h1 {
    font-family: var(--body-font);
    font-weight: 700;
    font-size: 31px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0;
  }
  .sub {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .lede {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 9px 0 0;
    max-width: 640px;
  }
  .rule { height: 1px; background: var(--rule); margin: 22px 0 0; }

  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 22px;
    margin-top: 24px;
  }
  .card {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    padding: 22px 20px 24px;
  }
  .slot { display: flex; align-items: center; justify-content: center; }
  .slot svg { width: 108px; height: 108px; display: block; }

  figcaption { text-align: center; }
  .agent {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: var(--text);
  }
  .animal {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 7px;
  }
  .note {
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-secondary);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <h1>Six agents, six animals</h1>
      <div class="sub">Digital Me · avatar system</div>
    </div>
    <p class="lede">Hand-authored SVG, shipped straight from the production renderer. One animal per agent, so identity is legible before a single label is read.</p>
    <div class="rule"></div>
  </header>

  <section class="grid">
      <figure class="card" data-animal="elephant">
        <div class="slot" id="slot-elephant"></div>
        <figcaption>
          <div class="agent">Memory Agent</div>
          <div class="animal">Elephant</div>
          <div class="note">never forgets</div>
        </figcaption>
      </figure>
      <figure class="card" data-animal="spider">
        <div class="slot" id="slot-spider"></div>
        <figcaption>
          <div class="agent">Connection Mapper</div>
          <div class="animal">Spider</div>
          <div class="note">weaves connections</div>
        </figcaption>
      </figure>
      <figure class="card" data-animal="owl">
        <div class="slot" id="slot-owl"></div>
        <figcaption>
          <div class="agent">Information Agent</div>
          <div class="animal">Owl</div>
          <div class="note">watches the world</div>
        </figcaption>
      </figure>
      <figure class="card" data-animal="chameleon">
        <div class="slot" id="slot-chameleon"></div>
        <figcaption>
          <div class="agent">Interface Agent</div>
          <div class="animal">Chameleon</div>
          <div class="note">adapts to content</div>
        </figcaption>
      </figure>
      <figure class="card" data-animal="fox">
        <div class="slot" id="slot-fox"></div>
        <figcaption>
          <div class="agent">Strategist</div>
          <div class="animal">Fox</div>
          <div class="note">reads the landscape</div>
        </figcaption>
      </figure>
      <figure class="card" data-animal="dove">
        <div class="slot" id="slot-dove"></div>
        <figcaption>
          <div class="agent">Communication Agent</div>
          <div class="animal">Dove</div>
          <div class="note">carries the message</div>
        </figcaption>
      </figure>
  </section>

const AVATAR_COLORS = {

    normal: { FILL:'#1C1916', STROKE:'#3D3530', BODY:'#5A7A8A', BODY2:'#4A6A7A', IRIS:'#AA8030' }
  }
};

function getAvatar(animal, highlight) {
  const a = (animal||'').toLowerCase();
  const svg = AVATARS[a] || '';
  const colors = (AVATAR_COLORS[a] || {})[highlight ? 'glow' : 'normal'] || {};
  return svg
    .replace(/#CLASS_FILL#/g, colors.FILL || '#1C1916')
    .replace(/#CLASS_STROKE#/g, colors.STROKE || '#3D3530')
    .replace(/#CLASS_BODY#/g, colors.BODY || '#888')
    .replace(/#CLASS_BODY2#/g, colors.BODY2 || '#666')
    .replace(/#CLASS_WEB#/g, colors.WEB || '#333')
    .replace(/#CLASS_EYE_RING#/g, colors.EYE_RING || '#888')
    .replace(/#CLASS_IRIS#/g, colors.IRIS || '#AA8030');
}

// render every avatar in its "glow" (active) state
['elephant','spider','owl','chameleon','fox','dove'].forEach(function (a) {
  document.getElementById('slot-' + a).innerHTML = getAvatar(a, true);
});
</script>

</html>
